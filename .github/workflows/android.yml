name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: set up JDK 21
      uses: actions/setup-java@main
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build debug
      run: ./gradlew app:assembleDebug
        
    - name: Build release
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: ./gradlew app:assembleRelease

    - name: Verify release Xposed entry point
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code \
          --class org.matrix.chromext.MainHook --method '<init>()V' \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Rename debug build
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

    - name: Rename signed apk
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt.apk

    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ChromeXt.apk
        path: app/build/outputs/apk/release/ChromeXt.apk
        retention-days: 14
        overwrite: true
        archive: false

    - uses: noriban/sign-android-release@master
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload debug build
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_debug.apk
        path: app/build/ChromeXt_debug.apk

    - name: Upload signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_signed.apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}

    - name: Collect debug build
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_debug.apk

    - name: Collect signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_signed.apk
